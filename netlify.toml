# Netlify builds the website and publishes the API from this one project.
# Values go in Netlify's environment variables: see "Going live" in README.md.

[build]
  command = "node scripts/netlify-build.mjs"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Page routes fall back to the app through web/public/_redirects. The API at /v1 is matched first.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The sticker scanner on "Link a sticker" needs the camera. Nothing needs location or the microphone.
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"

# Chat links carry the room key in the address, so they must never be sent on to another site.
[[headers]]
  for = "/c/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

# Files in /assets have a content hash in their name, so they never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
